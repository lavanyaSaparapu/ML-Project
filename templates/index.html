<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BigQuery Release Hub</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(23, 32, 53, 0.6);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --gcp-blue: #4285f4;
            --gcp-red: #ea4335;
            --gcp-yellow: #fbbc05;
            --gcp-green: #34a853;
            --accent-glow: rgba(66, 133, 244, 0.15);
            --twitter-blue: #1d9bf0;
            --font-display: 'Outfit', sans-serif;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(66, 133, 244, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(52, 168, 83, 0.08) 0px, transparent 50%),
                radial-gradient(at 50% 100%, rgba(234, 67, 53, 0.05) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-primary);
            font-family: var(--font-sans);
            min-height: 100vh;
            padding-bottom: 120px;
            overflow-x: hidden;
        }

        header {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 24px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-gcp-dots {
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .dot-blue { background-color: var(--gcp-blue); }
        .dot-red { background-color: var(--gcp-red); }
        .dot-yellow { background-color: var(--gcp-yellow); }
        .dot-green { background-color: var(--gcp-green); }

        h1 {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 28px;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .refresh-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 9999px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(12px);
        }

        .refresh-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .refresh-btn:active {
            transform: translateY(0);
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--text-primary);
            animation: spin 1s linear infinite;
            display: none;
        }

        .refresh-btn.loading .spinner {
            display: inline-block;
        }

        .refresh-btn.loading .btn-icon {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            gap: 16px;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            flex-grow: 1;
            max-width: 400px;
        }

        .search-box input {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px 16px 12px 40px;
            color: var(--text-primary);
            font-family: var(--font-sans);
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--gcp-blue);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .search-box svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            fill: var(--text-secondary);
            width: 16px;
            height: 16px;
            pointer-events: none;
        }

        .filters {
            display: flex;
            gap: 8px;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.07);
        }

        .filter-btn.active {
            background: var(--gcp-blue);
            color: white;
            border-color: var(--gcp-blue);
            box-shadow: 0 0 10px rgba(66, 133, 244, 0.3);
        }

        .date-group {
            margin-bottom: 40px;
        }

        .date-title {
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #c7d2fe;
        }

        .date-line {
            flex-grow: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--card-border) 0%, transparent 100%);
        }

        .updates-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .update-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(8px);
        }

        .update-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            border-radius: 16px 0 0 16px;
            background-color: transparent;
            transition: all 0.2s ease;
        }

        .update-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .update-card.selected {
            border-color: var(--gcp-blue);
            background: rgba(66, 133, 244, 0.05);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .update-card.selected::before {
            background-color: var(--gcp-blue);
        }

        .update-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .badge {
            font-family: var(--font-display);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .badge-feature {
            background: rgba(52, 168, 83, 0.15);
            color: #81c784;
            border: 1px solid rgba(52, 168, 83, 0.2);
        }

        .badge-issue {
            background: rgba(234, 67, 53, 0.15);
            color: #e57373;
            border: 1px solid rgba(234, 67, 53, 0.2);
        }

        .badge-deprecation {
            background: rgba(251, 188, 5, 0.15);
            color: #ffd54f;
            border: 1px solid rgba(251, 188, 5, 0.2);
        }

        .badge-other {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .update-content {
            font-size: 15px;
            line-height: 1.6;
            color: #e2e8f0;
        }

        .update-content p {
            margin-bottom: 8px;
        }
        
        .update-content p:last-child {
            margin-bottom: 0;
        }

        .update-content a {
            color: #818cf8;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .update-content a:hover {
            color: #a5b4fc;
            text-decoration: underline;
        }

        .selection-check {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .update-card.selected .selection-check {
            border-color: var(--gcp-blue);
            background: var(--gcp-blue);
        }

        .selection-check svg {
            width: 12px;
            height: 12px;
            fill: white;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .update-card.selected .selection-check svg {
            opacity: 1;
        }

        /* Floating Action Bar */
        .action-bar {
            position: fixed;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            padding: 16px 24px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            width: calc(100% - 48px);
            max-width: 800px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
        }

        .action-bar.visible {
            bottom: 24px;
        }

        .action-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
        }

        .action-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .action-preview {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tweet-btn {
            background-color: var(--twitter-blue);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .tweet-btn:hover {
            background-color: #1a8cd8;
            transform: scale(1.02);
            box-shadow: 0 0 15px rgba(29, 155, 240, 0.4);
        }

        .tweet-btn svg {
            width: 16px;
            height: 16px;
            fill: white;
        }

        /* Empty & Loading States */
        .loader-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 0;
            color: var(--text-secondary);
            gap: 16px;
        }

        .loader-state .spinner {
            width: 40px;
            height: 40px;
            border-width: 3px;
            display: block;
        }

        .empty-state {
            text-align: center;
            padding: 60px 24px;
            color: var(--text-secondary);
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            fill: var(--text-secondary);
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state h3 {
            color: var(--text-primary);
            margin-bottom: 8px;
            font-family: var(--font-display);
        }

        /* Responsive */
        @media (max-width: 640px) {
            header {
                flex-direction: column;
                gap: 16px;
                text-align: center;
                padding-top: 24px;
            }
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            .search-box {
                max-width: none;
            }
            .action-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 16px;
            }
            .tweet-btn {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo-gcp-dots">
                <span class="dot dot-blue"></span>
                <span class="dot dot-red"></span>
                <span class="dot dot-yellow"></span>
                <span class="dot dot-green"></span>
            </div>
            <h1>BigQuery Release Hub</h1>
        </div>
        <button id="refresh-btn" class="refresh-btn">
            <span class="spinner"></span>
            <svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
            </svg>
            Refresh Feed
        </button>
    </header>

    <main>
        <div class="controls">
            <div class="search-box">
                <svg viewBox="0 0 24 24">
                    <path d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z"/>
                </svg>
                <input type="text" id="search-input" placeholder="Search updates (e.g. Gemini, JSON)...">
            </div>
            <div class="filters">
                <button class="filter-btn active" data-filter="all">All Updates</button>
                <button class="filter-btn" data-filter="feature">Features</button>
                <button class="filter-btn" data-filter="issue">Issues</button>
                <button class="filter-btn" data-filter="deprecation">Deprecations</button>
            </div>
        </div>

        <div id="feed-container">
            <div class="loader-state">
                <div class="spinner"></div>
                <p>Fetching BigQuery release notes...</p>
            </div>
        </div>
    </main>

    <!-- Floating Action Bar -->
    <div id="action-bar" class="action-bar">
        <div class="action-info">
            <span class="action-title" id="selected-type">Feature Selected</span>
            <span class="action-preview" id="selected-preview">Select an update to preview...</span>
        </div>
        <button id="tweet-btn" class="tweet-btn">
            <svg viewBox="0 0 24 24">
                <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
            </svg>
            Tweet Update
        </button>
    </div>

    <script>
        let allUpdates = [];
        let selectedUpdate = null;
        let currentFilter = 'all';

        const feedContainer = document.getElementById('feed-container');
        const refreshBtn = document.getElementById('refresh-btn');
        const searchInput = document.getElementById('search-input');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const actionBar = document.getElementById('action-bar');
        const selectedTypeEl = document.getElementById('selected-type');
        const selectedPreviewEl = document.getElementById('selected-preview');
        const tweetBtn = document.getElementById('tweet-btn');

        async function fetchFeed() {
            refreshBtn.classList.add('loading');
            try {
                const response = await fetch('/api/releases');
                const data = await response.json();
                
                if (data.status === 'success') {
                    parseReleases(data.releases);
                    renderFeed();
                } else {
                    showError(data.message || 'Failed to fetch release notes.');
                }
            } catch (error) {
                showError('Network error. Please make sure the Flask backend is running.');
            } finally {
                refreshBtn.classList.remove('loading');
            }
        }

        function parseReleases(releases) {
            allUpdates = [];
            const tempDiv = document.createElement('div');

            releases.forEach((release) => {
                tempDiv.innerHTML = release.content;
                
                // BigQuery release notes contain h3 tags representing the update type,
                // followed by paragraph tags containing the detail.
                const children = Array.from(tempDiv.children);
                let currentType = 'Other';
                let currentParagraphs = [];

                children.forEach((child) => {
                    if (child.tagName === 'H3') {
                        // If we already collected paragraphs for a previous heading, save it
                        if (currentParagraphs.length > 0) {
                            allUpdates.push({
                                date: release.title,
                                rawDate: release.updated,
                                link: release.link,
                                type: currentType,
                                content: currentParagraphs.join('')
                            });
                            currentParagraphs = [];
                        }
                        currentType = child.textContent.trim();
                    } else if (child.tagName === 'P' || child.tagName === 'UL' || child.tagName === 'OL') {
                        currentParagraphs.push(child.outerHTML);
                    }
                });

                // Add the last one if exists
                if (currentParagraphs.length > 0) {
                    allUpdates.push({
                        date: release.title,
                        rawDate: release.updated,
                        link: release.link,
                        type: currentType,
                        content: currentParagraphs.join('')
                    });
                }
            });
        }

        function renderFeed() {
            const query = searchInput.value.toLowerCase().trim();
            
            // Filter
            let filtered = allUpdates.filter(update => {
                const matchesSearch = update.content.toLowerCase().includes(query) || 
                                      update.type.toLowerCase().includes(query) ||
                                      update.date.toLowerCase().includes(query);
                
                if (currentFilter === 'all') return matchesSearch;
                return matchesSearch && update.type.toLowerCase() === currentFilter;
            });

            if (filtered.length === 0) {
                feedContainer.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24">
                            <path d="M13 14H11V9H13V14M13 18H11V16H13V18M1 21H23L12 2L1 21Z"/>
                        </svg>
                        <h3>No updates found</h3>
                        <p>Try refining your search query or changing the filter.</p>
                    </div>
                `;
                return;
            }

            // Group by date
            const grouped = {};
            filtered.forEach(update => {
                if (!grouped[update.date]) {
                    grouped[update.date] = [];
                }
                grouped[update.date].push(update);
            });

            let html = '';
            for (const [date, updates] of Object.entries(grouped)) {
                html += `
                    <div class="date-group">
                        <h2 class="date-title">
                            ${date}
                            <span class="date-line"></span>
                        </h2>
                        <div class="updates-grid">
                `;

                updates.forEach((update, idx) => {
                    const badgeClass = `badge-${update.type.toLowerCase()}` || 'badge-other';
                    const isSelected = selectedUpdate && 
                                      selectedUpdate.date === update.date && 
                                      selectedUpdate.content === update.content;

                    html += `
                        <div class="update-card ${isSelected ? 'selected' : ''}" 
                             onclick="selectCard(this, ${allUpdates.indexOf(update)})">
                            <div class="update-header">
                                <span class="badge ${badgeClass}">${update.type}</span>
                                <div class="selection-check">
                                    <svg viewBox="0 0 24 24">
                                        <path d="M21,7L9,19L3.5,13.5L4.91,12.09L9,16.17L19.59,5.59L21,7Z"/>
                                    </svg>
                                </div>
                            </div>
                            <div class="update-content">${update.content}</div>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            }

            feedContainer.innerHTML = html;
        }

        function selectCard(cardEl, index) {
            const update = allUpdates[index];
            
            // If clicking the already selected card, deselect it
            if (selectedUpdate && selectedUpdate.date === update.date && selectedUpdate.content === update.content) {
                selectedUpdate = null;
                cardEl.classList.remove('selected');
                actionBar.classList.remove('visible');
            } else {
                // Remove selected from other cards
                document.querySelectorAll('.update-card').forEach(el => el.classList.remove('selected'));
                
                selectedUpdate = update;
                cardEl.classList.add('selected');
                
                // Get clean text for preview
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = update.content;
                const cleanText = tempDiv.textContent || tempDiv.innerText || "";
                
                selectedTypeEl.textContent = `${update.type} Update (${update.date})`;
                selectedPreviewEl.textContent = cleanText;
                actionBar.classList.add('visible');
            }
        }

        function showError(message) {
            feedContainer.innerHTML = `
                <div class="empty-state" style="color: var(--gcp-red)">
                    <svg viewBox="0 0 24 24" style="fill: var(--gcp-red)">
                        <path d="M12,2L1,21H23L12,2M12,6L19.53,19H4.47L12,6M11,10V14H13V10H11M11,16V18H13V16H11Z"/>
                    </svg>
                    <h3>Error Loading Releases</h3>
                    <p>${message}</p>
                </div>
            `;
        }

        // Twitter web intent builder
        tweetBtn.addEventListener('click', () => {
            if (!selectedUpdate) return;
            
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = selectedUpdate.content;
            let text = tempDiv.textContent || tempDiv.innerText || "";
            
            // Format content nicely for tweet
            const header = `🚀 BigQuery ${selectedUpdate.type} (${selectedUpdate.date}): `;
            const footer = `\n\n#GoogleCloud #BigQuery`;
            
            // Trim text to fit character limit (280 max including tags and link)
            const maxTextLength = 280 - header.length - footer.length - 23; // 23 is default t.co URL length
            if (text.length > maxTextLength) {
                text = text.substring(0, maxTextLength - 3) + '...';
            }
            
            const tweetText = `${header}${text}${footer}`;
            const tweetUrl = encodeURIComponent(selectedUpdate.link);
            
            window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(tweetText)}&url=${tweetUrl}`, '_blank');
        });

        // Search Input handler
        searchInput.addEventListener('input', renderFeed);

        // Filter button handlers
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderFeed();
            });
        });

        refreshBtn.addEventListener('click', fetchFeed);

        // Load initially
        fetchFeed();
    </script>
</body>
</html>
